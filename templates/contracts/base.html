<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ContractCommand{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #17365d;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        main {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .04);
            margin-bottom: 20px;
        }

        .actions,
        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            background: #17365d;
            color: white;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button.secondary {
            background: #475569;
        }

        .button.danger {
            background: #b91c1c;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        .filters input,
        .filters select {
            width: auto;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
        }

        a {
            color: #1d4ed8;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .errorlist {
            color: #b91c1c;
        }

        .messages {
            padding: 12px;
            background: #dcfce7;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .muted {
            color: #64748b;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .details dt {
            color: #64748b;
            margin-bottom: 6px;
        }

        .details dd {
            margin: 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            .filters {
                align-items: stretch;
            }

            .filters input,
            .filters select {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <strong>
            <a href="{% url 'contracts:list' %}">ContractCommand</a>
        </strong>

        <nav>
            <a href="{% url 'contracts:list' %}">Contracts</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="button secondary" type="submit">
                    Log out
                </button>
            </form>
        </nav>
    </header>

    <main>
        {% if messages %}
        {% for message in messages %}
        <div class="messages">{{ message }}</div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
